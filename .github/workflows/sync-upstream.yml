name: Sync upstream unstable

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Fork branch to merge official unstable into
        required: false
        default: unstable
      publish_image:
        description: Build and publish GHCR image even if already current
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/x-t-e-r/axonhub
  TARGET_BRANCH: ${{ inputs.target_branch || 'unstable' }}

jobs:
  merge-upstream:
    name: Merge official unstable
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.target.outputs.target_branch }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      short_sha: ${{ steps.revision.outputs.short_sha }}
      version: ${{ steps.revision.outputs.version }}
      should_publish: ${{ steps.publish.outputs.should_publish }}

    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          IMAGE_TAG="${TARGET_BRANCH//\//-}"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout fork target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add official https://github.com/looplj/axonhub.git
          git fetch official unstable:refs/remotes/official/unstable

      - name: Merge upstream unstable
        id: merge
        shell: bash
        run: |
          if git merge-base --is-ancestor official/unstable HEAD; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            echo "Fork branch already contains official/unstable."
            exit 0
          fi

          if ! git merge --no-edit official/unstable; then
            echo "::error::Merge conflict while syncing official/unstable into ${TARGET_BRANCH}."
            echo "::group::Conflicted files"
            git diff --name-only --diff-filter=U | sed 's/^/- /'
            echo "::endgroup::"
            echo "::group::Git status"
            git status --short
            echo "::endgroup::"
            exit 1
          fi
          echo "already_current=false" >> "$GITHUB_OUTPUT"

      - name: Push merged branch
        if: steps.merge.outputs.already_current != 'true'
        run: git push origin HEAD:${{ env.TARGET_BRANCH }}

      - name: Resolve synced revision
        id: revision
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="${{ steps.target.outputs.image_tag }}-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decide image publish
        id: publish
        shell: bash
        run: |
          if [[ "${{ steps.merge.outputs.already_current }}" != "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_image }}" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build-single-arch:
    name: Build and push ${{ matrix.arch }} synced image
    needs: merge-upstream
    if: needs.merge-upstream.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout synced branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.merge-upstream.outputs.target_branch }}

      - name: Write build version
        run: echo "${{ needs.merge-upstream.outputs.version }}" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve arch tags
        id: tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${{ needs.merge-upstream.outputs.image_tag }}-${{ matrix.arch }}"
            echo "${IMAGE_NAME}:sha-${{ needs.merge-upstream.outputs.short_sha }}-${{ matrix.arch }}"
            if [[ "${{ needs.merge-upstream.outputs.image_tag }}" == "unstable" ]]; then
              echo "${IMAGE_NAME}:latest-${{ matrix.arch }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: false
          sbom: false

  create-manifests:
    name: Create synced multi-arch manifests
    needs: [merge-upstream, build-single-arch]
    if: needs.merge-upstream.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${{ needs.merge-upstream.outputs.image_tag }}" \
            "${IMAGE_NAME}:${{ needs.merge-upstream.outputs.image_tag }}-amd64" \
            "${IMAGE_NAME}:${{ needs.merge-upstream.outputs.image_tag }}-arm64"

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:sha-${{ needs.merge-upstream.outputs.short_sha }}" \
            "${IMAGE_NAME}:sha-${{ needs.merge-upstream.outputs.short_sha }}-amd64" \
            "${IMAGE_NAME}:sha-${{ needs.merge-upstream.outputs.short_sha }}-arm64"

          if [[ "${{ needs.merge-upstream.outputs.image_tag }}" == "unstable" ]]; then
            docker buildx imagetools create \
              -t "${IMAGE_NAME}:latest" \
              "${IMAGE_NAME}:latest-amd64" \
              "${IMAGE_NAME}:latest-arm64"
          fi
