name: Publish GHCR image

on:
  workflow_dispatch:
  push:
    branches:
      - unstable
      - codex/key-panel-unstable-sync
    tags:
      - 'v*'
      - 'key-health-*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/x-t-e-r/axonhub

jobs:
  metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      ref_name: ${{ steps.meta.outputs.ref_name }}
      ref_type: ${{ steps.meta.outputs.ref_type }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
      publish_latest: ${{ steps.meta.outputs.publish_latest }}
    steps:
      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REF_NAME="${GITHUB_REF_NAME}"
          REF_TYPE="${GITHUB_REF_TYPE}"
          if [[ "${REF_TYPE}" == "branch" && "${REF_NAME}" == "codex/key-panel-unstable-sync" ]]; then
            REF_NAME="key-health-latest"
          fi
          if [[ "${REF_TYPE}" == "tag" ]]; then
            VERSION="${REF_NAME}"
            PUBLISH_LATEST="false"
          else
            VERSION="${REF_NAME}-${SHORT_SHA}"
            if [[ "${REF_NAME}" == "unstable" ]]; then
              PUBLISH_LATEST="true"
            else
              PUBLISH_LATEST="false"
            fi
          fi
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "ref_type=${REF_TYPE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${PUBLISH_LATEST}" >> "$GITHUB_OUTPUT"

  build-single-arch:
    name: Build and push ${{ matrix.arch }} image
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write build version
        run: echo "${{ needs.metadata.outputs.version }}" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve arch tags
        id: tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${{ needs.metadata.outputs.short_sha }}-${{ matrix.arch }}"
            if [[ "${{ needs.metadata.outputs.ref_type }}" == "tag" ]]; then
              echo "${IMAGE_NAME}:${{ needs.metadata.outputs.ref_name }}-${{ matrix.arch }}"
            else
              echo "${IMAGE_NAME}:${{ needs.metadata.outputs.ref_name }}-${{ matrix.arch }}"
              if [[ "${{ needs.metadata.outputs.publish_latest }}" == "true" ]]; then
                echo "${IMAGE_NAME}:latest-${{ matrix.arch }}"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: false
          sbom: false

  create-manifests:
    name: Create multi-arch manifests
    needs: [metadata, build-single-arch]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:sha-${{ needs.metadata.outputs.short_sha }}" \
            "${IMAGE_NAME}:sha-${{ needs.metadata.outputs.short_sha }}-amd64" \
            "${IMAGE_NAME}:sha-${{ needs.metadata.outputs.short_sha }}-arm64"

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${{ needs.metadata.outputs.ref_name }}" \
            "${IMAGE_NAME}:${{ needs.metadata.outputs.ref_name }}-amd64" \
            "${IMAGE_NAME}:${{ needs.metadata.outputs.ref_name }}-arm64"

          if [[ "${{ needs.metadata.outputs.publish_latest }}" == "true" ]]; then
            docker buildx imagetools create \
              -t "${IMAGE_NAME}:latest" \
              "${IMAGE_NAME}:latest-amd64" \
              "${IMAGE_NAME}:latest-arm64"
          fi
