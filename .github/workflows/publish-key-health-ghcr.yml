name: Publish key health GHCR image

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - publish-key-health

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/x-t-e-r/axonhub
  SOURCE_REF: feature/channel-key-health-policies
  IMAGE_TAG: key-health-latest

jobs:
  metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  build-single-arch:
    name: Build and push ${{ matrix.arch }} image
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Write build version
        run: echo "${{ needs.metadata.outputs.version }}" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ needs.metadata.outputs.short_sha }}-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
          provenance: false
          sbom: false

  create-manifests:
    name: Create multi-arch manifests
    needs: [metadata, build-single-arch]
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:sha-${{ needs.metadata.outputs.short_sha }}" \
            "${IMAGE_NAME}:sha-${{ needs.metadata.outputs.short_sha }}-amd64" \
            "${IMAGE_NAME}:sha-${{ needs.metadata.outputs.short_sha }}-arm64"

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
            "${IMAGE_NAME}:${IMAGE_TAG}-arm64"